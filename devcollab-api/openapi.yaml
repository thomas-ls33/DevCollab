components:
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        displayName:
          type: string
        bio:
          type: string
        location:
          type: string
          nullable: true
        githubUrl:
          type: string
          nullable: true
        skills:
          type: array
          items:
            type: string
        followersCount:
          type: integer
        followingCount:
          type: integer
        isFollowing:
          type: boolean
        createdAt:
          type: string
          format: date-time
    UserUpdate:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 100
        bio:
          type: string
          maxLength: 280
        location:
          type: string
          maxLength: 100
        githubUrl:
          type: string
          format: uri
        skills:
          type: array
          items:
            type: string
          maxItems: 20
      required:
      - displayName
    Member:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        repoUrl:
          type: string
          nullable: true
        technologies:
          type: array
          items:
            type: string
        ownerId:
          type: string
        ownerName:
          type: string
        contributors:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        openPullRequests:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProjectInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        description:
          type: string
        repoUrl:
          type: string
          format: uri
        technologies:
          type: array
          items:
            type: string
          maxItems: 20
      required:
      - name
      - description
    ContributionRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        userId:
          type: string
        username:
          type: string
        message:
          type: string
        status:
          type: string
          enum:
          - pending
          - accepted
          - rejected
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
          nullable: true
    ContributionInput:
      type: object
      properties:
        message:
          type: string
          maxLength: 2000
      required:
      - message
    ContributionDecision:
      type: object
      properties:
        status:
          type: string
          enum:
          - accepted
          - rejected
      required:
      - status
    FileChange:
      type: object
      properties:
        path:
          type: string
        patch:
          type: string
          description: Diff unifié (format git diff)
      required:
      - path
      - patch
    PullRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        projectName:
          type: string
        authorId:
          type: string
        authorName:
          type: string
        title:
          type: string
        description:
          type: string
        sourceBranch:
          type: string
        targetBranch:
          type: string
        status:
          type: string
          enum:
          - open
          - closed
          - merged
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileChange'
        reviewsCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        mergedAt:
          type: string
          format: date-time
          nullable: true
        closedAt:
          type: string
          format: date-time
          nullable: true
    PullRequestInput:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 120
        description:
          type: string
        sourceBranch:
          type: string
        targetBranch:
          type: string
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileChange'
          maxItems: 50
      required:
      - projectId
      - title
      - sourceBranch
      - targetBranch
    PullRequestUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
          - open
          - closed
          - merged
    LineComment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        file:
          type: string
        line:
          type: integer
        body:
          type: string
        authorId:
          type: string
        authorName:
          type: string
        createdAt:
          type: string
          format: date-time
    Review:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pullRequestId:
          type: string
          format: uuid
        reviewerId:
          type: string
        reviewerName:
          type: string
        verdict:
          type: string
          enum:
          - approved
          - changes_requested
          - commented
        body:
          type: string
        comments:
          type: array
          items:
            $ref: '#/components/schemas/LineComment'
        createdAt:
          type: string
          format: date-time
    LineCommentInput:
      type: object
      properties:
        file:
          type: string
        line:
          type: integer
          minimum: 0
        body:
          type: string
      required:
      - file
      - line
      - body
    ReviewInput:
      type: object
      properties:
        pullRequestId:
          type: string
          format: uuid
        verdict:
          type: string
          enum:
          - approved
          - changes_requested
          - commented
          default: commented
        body:
          type: string
        comments:
          type: array
          items:
            $ref: '#/components/schemas/LineCommentInput'
      required:
      - pullRequestId
    Activity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - project_created
          - contribution_requested
          - contribution_accepted
          - pr_opened
          - pr_merged
          - pr_closed
          - review_submitted
          - user_followed
        actorId:
          type: string
        actorName:
          type: string
        projectId:
          type: string
          nullable: true
        projectName:
          type: string
          nullable: true
        targetId:
          type: string
          nullable: true
        targetLabel:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
  securitySchemes:
    cognito:
      type: apiKey
      name: Authorization
      in: header
      x-amazon-apigateway-authtype: cognito_user_pools
      x-amazon-apigateway-authorizer:
        type: cognito_user_pools
        providerARNs:
        - arn:aws:cognito-idp:${AWS_REGION}:${AWS_ACCOUNT_ID}:userpool/${COGNITO_USER_POOL_ID}
