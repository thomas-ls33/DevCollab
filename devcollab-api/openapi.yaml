openapi: 3.0.1
info:
  title: devcollab-api
  version: 1.0.0
  description: 'API REST de DevCollab : développeurs, projets open source, contributions, pull requests, reviews de code et fil d''activité.


    Toutes les routes (sauf OPTIONS) exigent un jeton ID Cognito dans l''en-tête `Authorization`.'
servers:
- url: https://{apiId}.execute-api.us-east-1.amazonaws.com/{stage}
  variables:
    apiId:
      default: gn25if1p83
    stage:
      default: prod
tags:
- name: Utilisateurs
- name: Abonnements
- name: Projets
- name: Contributions
- name: Pull requests
- name: Reviews
- name: Activité
- name: CORS
paths:
  /users/me:
    get:
      tags:
      - Utilisateurs
      summary: Profil de l'utilisateur connecté
      security:
      - cognito: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        passthroughBehavior: when_no_match
        uri: arn:aws:apigateway:${AWS_REGION}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS_REGION}:${AWS_ACCOUNT_ID}:function:devcollab-utilisateurs/invocations
      description: Le profil est créé automatiquement à la première requête à partir des informations Cognito.
    put:
      tags:
      - Utilisateurs
      summary: Mettre à jour son profil et ses compétences
      security:
      - cognito: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Données invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        passthroughBehavior: when_no_match
        uri: arn:aws:apigateway:${AWS_REGION}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS_REGION}:${AWS_ACCOUNT_ID}:function:devcollab-utilisateurs/invocations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
    options:
      parameters: []
      tags:
      - CORS
      summary: Pré-vol CORS
      security: []
      responses:
        '204':
          description: En-têtes CORS
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        passthroughBehavior: when_no_match
        uri: arn:aws:apigateway:${AWS_REGION}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS_REGION}:${AWS_ACCOUNT_ID}:function:devcollab-utilisateurs/invocations
  /users:
    get:
      tags:
      - Utilisateurs
      summary: Rechercher des développeurs
      security:
      - cognito: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        passthroughBehavior: when_no_match
        uri: arn:aws:apigateway:${AWS_REGION}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS_REGION}:${AWS_ACCOUNT_ID}:function:devcollab-utilisateurs/invocations
      parameters:
      - name: q
        in: query
        required: false
        description: Recherche sur le nom d'utilisateur ou le nom affiché
        schema:
          type: string
      - name: skill
        in: query
        required: false
        description: Filtrer par compétence (insensible à la casse)
        schema:
          type: string
    options:
      parameters: []
      tags:
      - CORS
      summary: Pré-vol CORS
      security: []
      responses:
        '204':
          description: En-têtes CORS
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        passthroughBehavior: when_no_match
        uri: arn:aws:apigateway:${AWS_REGION}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS_REGION}:${AWS_ACCOUNT_ID}:function:devcollab-utilisateurs/invocations
  /users/{id}:
    get:
      tags:
      - Utilisateurs
      summary: Profil d'un développeur
      security:
      - cognito: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
